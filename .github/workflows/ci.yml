name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-service, robot-gateway, content-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build và test ${{ matrix.service }}
        run: mvn -B verify
        working-directory: services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web
        run: |
          npm install
          npm run build
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp docker-compose
        run: docker compose config -q
