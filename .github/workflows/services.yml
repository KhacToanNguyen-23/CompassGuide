name: services

on:
  pull_request:
    paths:
      - "services/**"
      - "contracts/**"
      - "docker-compose.yml"
      - ".github/workflows/services.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "contracts/**"
      - "docker-compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-service, robot-gateway, content-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build và test ${{ matrix.service }}
        run: mvn -B verify
        working-directory: services/${{ matrix.service }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cú pháp docker-compose
        run: docker compose config -q
