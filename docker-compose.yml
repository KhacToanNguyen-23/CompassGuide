# Chạy toàn bộ platform ở máy dev:  docker compose up --build
# Chỉ api-gateway và web mở ra máy host cho người dùng; các service khác mở cổng để dev gỡ lỗi.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dynamodb-local:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      TOUR_SERVICE_URL: http://tour-service:8080
      CONTENT_SERVICE_URL: http://content-service:8080
      ROBOT_GATEWAY_URL: http://robot-gateway:8080
      AI_SERVICE_URL: http://ai-service:8080
    depends_on: [tour-service, content-service, robot-gateway, ai-service]

  tour-service:
    build: ./services/tour-service
    ports:
      - "8081:8080"
    environment:
      ROBOT_GATEWAY_URL: http://robot-gateway:8080
      CONTENT_SERVICE_URL: http://content-service:8080
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on: [dynamodb-local]

  robot-gateway:
    build: ./services/robot-gateway
    ports:
      - "8082:8080"
    environment:
      TOUR_SERVICE_URL: http://tour-service:8080
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on: [mosquitto]

  content-service:
    build: ./services/content-service
    ports:
      - "8083:8080"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on: [dynamodb-local]

  ai-service:
    build: ./services/ai-service
    ports:
      - "8084:8080"

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on: [api-gateway]

  # Robot giả lập: dùng khi chưa có robot thật
  robot-simulator:
    build: ./simulator
    environment:
      ROBOT_ID: robot-01
      MQTT_HOST: mosquitto
    depends_on: [mosquitto]
